org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation crashes when the Pub cache (C:) and the
# project (D:) are on different Windows drives. Disable it to avoid the
# "this and base files have different roots" build failure.
kotlin.incremental=false
